# Build once, deploy that exact digest everywhere.
#
# main   -> staging automatically
# v* tag -> production, behind the environment approval configured in GitHub
#
# The image is never rebuilt between environments: staging and production run
# the same digest, which is the only way "it worked in staging" means anything.
name: cd

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  # Never two deploys to the same environment at once, and never cancel one
  # halfway through: a partial helm upgrade is worse than a queued one.
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # keyless signing
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        # Keyless: the signature is bound to this workflow's OIDC identity, so
        # verifying it proves which repository and ref produced the image.
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attest the build
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  staging:
    name: deploy staging
    needs: publish
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      namespace: workbench-staging
      release: workbench
      values: deploy/helm/values-staging.yaml
      digest: ${{ needs.publish.outputs.digest }}
      url: https://workbench.staging.example.com
    secrets: inherit

  production:
    name: deploy production
    needs: [publish, staging]
    # Tags only, and only after staging is green. GitHub environment protection
    # adds the human approval; this condition adds the ordering.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      namespace: workbench
      release: workbench
      values: deploy/helm/values-production.yaml
      digest: ${{ needs.publish.outputs.digest }}
      url: https://workbench.example.com
    secrets: inherit

{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workbench.fullname" . }}-migrate
  labels:
    {{- include "workbench.labels" . | nindent 4 }}
  annotations:
    # Schema first, always. A failed migration aborts the release rather than
    # leaving new code pointed at an old schema.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "workbench.serviceAccountName" . }}
      containers:
        - name: migrate
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          args: ["--migrate", "--migrations", "/app/migrations"]
          env:
            {{- include "workbench.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
